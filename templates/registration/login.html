{% extends "base.html" %}

{% block title %}Login - My Blog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">

        <h1 class="mb-4 text-center">Login</h1>

        {% if form.errors %}
        <div class="alert alert-danger" role="alert">
            Invalid username or password. Please try again.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label fw-semibold">Username:</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label fw-semibold">Password:</label>
                {{ form.password }}
            </div>
            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>

        <p class="text-center mt-3 mb-0">
            Don't have an account? <a href="{% url 'signup' %}">Sign up here</a>
        </p>

    </div>
</div>
{% endblock %}
