{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<style>
    .compact-form input, .compact-form select, .compact-form textarea {
        display: block; width: 100%; padding: 0.375rem 0.75rem; font-size: 0.9rem;
        font-weight: 400; line-height: 1.5; color: #212529; background-color: #fff;
        border: 1px solid #ced4da; border-radius: 0.25rem;
    }
    .select2-container--default .select2-selection--multiple { border: 1px solid #ced4da !important; min-height: 38px; }
    .form-group { margin-bottom: 1rem; }
    .form-label { font-weight: 600; font-size: 0.85rem; margin-bottom: 0.3rem; display: block; }
</style>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-2">
                    <h5 class="mb-0 text-center">New Project</h5>
                </div>

                <div class="card-body p-4 compact-form">
                    <form method="post" id="project-form" enctype="multipart/form-data">
                        {% csrf_token %}

                        {% for field in form %}
                        <div class="form-group">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
                        </div>
                        {% endfor %}

                        <div class="form-group mb-4">
                            <label class="form-label d-flex justify-content-between align-items-center">
                                Project Media
                                <div class="dropdown">
                                    <button class="btn btn-outline-primary btn-sm rounded-circle shadow-sm" type="button" id="addMediaMenu" data-bs-toggle="dropdown" aria-expanded="false" style="width: 32px; height: 32px; padding: 0;">
                                        <i class="bi bi-plus-lg"></i>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-end shadow border-0" aria-labelledby="addMediaMenu">
                                        <li>
                                            <label class="dropdown-item py-2" style="cursor: pointer;">
                                                <i class="bi bi-laptop me-2"></i> Upload from device
                                                <input type="file" name="upload_files" id="fileInput" multiple class="d-none">
                                            </label>
                                        </li>
                                        <li>
                                            <button type="button" class="dropdown-item py-2 text-muted" disabled>
                                                <i class="bi bi-search me-2"></i> Browse website (Coming soon)
                                            </button>
                                        </li>
                                    </ul>
                                </div>
                            </label>

                            <div id="fileListPreview" class="mt-2 d-flex flex-wrap gap-2">
                                <p class="text-muted small w-100 mb-0" id="noFilesMsg">No files selected yet.</p>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">Publish Project</button>
                            <a href="{% url 'core:home' %}" class="btn btn-sm btn-link text-secondary text-center">Cancel</a>
                        </div>
                    </form> </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
$(document).ready(function() {
    $('#id_tags').select2({
        tags: true, tokenSeparators: [',', ' '],
        placeholder: "Write or select tags...", width: '100%'
    });

    // Lògica per acumular fitxers
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('fileListPreview');
    let allFiles = []; // Llista interna per guardar tots els fitxers afegits

    fileInput.addEventListener('change', function(e) {
        const newFiles = Array.from(e.target.files);

        // Afegim els nous fitxers a la nostra llista global
        allFiles = allFiles.concat(newFiles);

        renderPreview();
        updateInputFiles(); // Actualitzem l'input real per a l'enviament
    });

    function renderPreview() {
        preview.innerHTML = '';
        if (allFiles.length === 0) {
            preview.innerHTML = '<p class="text-muted small w-100 mb-0">No files selected yet.</p>';
            return;
        }

        allFiles.forEach((file, index) => {
            const badge = document.createElement('span');
            badge.className = 'badge bg-light text-dark border p-2 small d-flex align-items-center shadow-sm';
            badge.innerHTML = `
                <i class="bi bi-file-earmark-check me-2 text-primary"></i>
                ${file.name}
                <i class="bi bi-x-lg ms-2 text-danger cursor-pointer" onclick="removeFile(${index})" style="cursor:pointer"></i>
            `;
            preview.appendChild(badge);
        });
    }

    // Funció per esborrar un fitxer de la llista abans de pujar-lo
    window.removeFile = function(index) {
        allFiles.splice(index, 1);
        renderPreview();
        updateInputFiles();
    };

    // Truc tècnic per sincronitzar la nostra llista JS amb l'input del formulari
    function updateInputFiles() {
        const dataTransfer = new DataTransfer();
        allFiles.forEach(file => dataTransfer.items.add(file));
        fileInput.files = dataTransfer.files;
    }
});
</script>
{% endblock %}
