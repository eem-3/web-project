{% extends "base.html" %}

{% block content %}
<!-- Estils originals + Select2 -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />

<style>
    /* El teu estil original */
    .compact-form input,
    .compact-form select,
    .compact-form textarea {
        display: block;
        width: 100%;
        padding: 0.375rem 0.75rem;
        font-size: 0.9rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #fff;
        background-clip: padding-box;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
        transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;
    }

    /* Ajust per a Select2 perquè sembli un input compacte */
    .select2-container--default .select2-selection--multiple {
        border: 1px solid #ced4da !important;
        min-height: 38px;
    }
    .select2-container .select2-selection--multiple .select2-selection__choice {
        background-color: #0d6efd;
        border: none;
        color: white;
        font-size: 0.8rem;
        border-radius: 4px;
    }

    .form-group { margin-bottom: 1rem; }
    .form-label { font-weight: 600; font-size: 0.85rem; margin-bottom: 0.3rem; display: block; }
</style>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-2">
                    <h5 class="mb-0 text-center">New Project</h5>
                </div>

                <div class="card-body p-4 compact-form">
                    <form method="post" id="project-form">
                        {% csrf_token %}

                        {% for field in form %}
                        <div class="form-group">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}

                            {% if field.help_text %}
                                <div class="text-muted" style="font-size: 0.75rem;">{{ field.help_text }}</div>
                            {% endif %}

                            {% for error in field.errors %}
                                <div class="text-danger small">{{ error }}</div>
                            {% endfor %}
                        </div>
                        {% endfor %}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">Publish Project</button>
                            <a href="{% url 'core:home' %}" class="btn btn-sm btn-link text-secondary text-center">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts necessaris -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
$(document).ready(function() {
    // Apliquem Select2 al camp de tags (id generat per Django)
    $('#id_tags').select2({
        tags: true,
        tokenSeparators: [',', ' '],
        placeholder: "Write or select tags...",
        width: '100%'
    });
});
</script>
{% endblock %}
