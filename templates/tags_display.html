<!DOCTYPE html>
<html>
<head>
    <title>Lista de Etiquetas</title>
</head>
<body>
    <h1>Mis Etiquetas (desde API interna)</h1>
    <ul>
        {% for item in tags %}
            <li>
                <strong>ID:</strong> {{ item.tag_id }} <br>
                <strong>Etiqueta:</strong> {{ item.tag }}
            </li>
            <hr>
        {% empty %}
            <li>No hay etiquetas registradas.</li>
        {% endfor %}
    </ul>
</body>
</html>
